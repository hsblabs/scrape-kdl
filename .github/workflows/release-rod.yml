name: Release go-rod adapter

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing adapter tag, such as adapters/rod/v1.0.0-rc.1
        required: true
        type: string
      channel:
        description: Publication channel
        required: true
        type: choice
        options: [rc, stable]
      confirmation:
        description: Type PUBLISH followed by the exact tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: v1-publication
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: adapters/rod/go.mod
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "26.x"
      - run: node scripts/check-publication-request.mjs rod "$RELEASE_TAG" "$RELEASE_CHANNEL" "$RELEASE_CONFIRMATION" "$OWNER_APPROVAL"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          OWNER_APPROVAL: ${{ secrets.PUBLICATION_APPROVAL }}
      - run: ./scripts/validate-release-tag.sh rod "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - working-directory: adapters/rod
        run: go test ./...
      - working-directory: adapters/rod
        run: go vet ./...
      - working-directory: adapters/rod
        run: go test -tags=e2e -timeout=15m ./...
      - name: Create GitHub release
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" ${{ inputs.channel == 'rc' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

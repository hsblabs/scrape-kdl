name: Release go-rod adapter

on:
  push:
    tags: ["adapters/rod/v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: adapters/rod/go.mod
      - run: ./scripts/validate-release-tag.sh rod "${GITHUB_REF_NAME}"
      - working-directory: adapters/rod
        run: go test ./...
      - working-directory: adapters/rod
        run: go vet ./...
      - working-directory: adapters/rod
        run: go test -tags=e2e -timeout=15m ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

name: Release go-rod adapter

on:
  push:
    tags: ["adapters/rod/v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event.repository.visibility == 'public'
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: adapters/rod/go.mod
      - run: ./scripts/validate-release-tag.sh rod "${GITHUB_REF_NAME}"
      - working-directory: adapters/rod
        run: go test ./...
      - working-directory: adapters/rod
        run: go vet ./...
      - working-directory: adapters/rod
        run: go test -tags=e2e -timeout=15m ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

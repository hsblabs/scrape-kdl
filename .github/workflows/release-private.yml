name: Release private core

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated core tag ending in -private.N
        required: true
        default: v0.9.0-private.1
        type: string
      confirmation:
        description: Type PUBLISH_PRIVATE_GITHUB_RELEASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-core-release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_PRIVATE_GITHUB_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Validate private release request
        run: |
          if [[ "$REPOSITORY_VISIBILITY" != private ]]; then
            echo "refusing private release while repository visibility is $REPOSITORY_VISIBILITY" >&2
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - name: Validate source tag
        run: |
          ./scripts/validate-private-release-tag.sh core "$RELEASE_VERSION"
          test "$(git cat-file -t "refs/tags/$RELEASE_VERSION")" = tag
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_VERSION"
      - run: make release-check
      - run: make release-dist VERSION="$RELEASE_VERSION" OUT=dist NPM_ACCESS=restricted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-core-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: private-core-${{ inputs.version }}
          path: dist
      - name: Create private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --latest=false \
            --title "$RELEASE_VERSION"

name: Opt-in live-site smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTP(S) page with a title; credentials are forbidden
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run build:typescript
      - run: node scripts/live-site-smoke.mjs "$LIVE_SITE_URL"
        env:
          LIVE_SITE_URL: ${{ inputs.url }}

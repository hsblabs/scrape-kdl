name: Opt-in live-site smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTP(S) page with a title; credentials are forbidden
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: npm run build:typescript
      - run: node scripts/live-site-smoke.mjs "$LIVE_SITE_URL"
        env:
          LIVE_SITE_URL: ${{ inputs.url }}

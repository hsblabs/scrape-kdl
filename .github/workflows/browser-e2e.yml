name: Browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: browser-e2e
  cancel-in-progress: false

jobs:
  rod-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: adapters/rod/go.mod
      - run: ./scripts/verify-rod.sh --e2e

  playwright-e2e:
    name: Playwright / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: make test-playwright-e2e
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

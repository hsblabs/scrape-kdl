name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing core tag version without a leading v
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_NPM to allow public registry writes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_NPM'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Validate publication request
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_VERSION" =~ $semver ]]; then
            echo "invalid npm release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-private.* ]]; then
            echo "refusing to publish private release version publicly: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$REPOSITORY_VISIBILITY" != public ]]; then
            echo "refusing npm publication while repository visibility is $REPOSITORY_VISIBILITY" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - name: Validate source tag
        run: |
          ./scripts/validate-public-release-tag.sh core "v$RELEASE_VERSION"
          test "$(git describe --exact-match --tags HEAD)" = "v$RELEASE_VERSION"
      - run: npm run build:typescript
      - run: node scripts/build-npm-release.mjs --version "$RELEASE_VERSION" --access public --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-packages
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-packages
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          registry-url: https://registry.npmjs.org
      - name: Verify npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error(`npm ${process.argv[1]} does not support trusted publishing; require >=11.5.1`);
            }
          ' "$npm_version"
      - name: Select npm dist-tag
        id: dist-tag
        run: |
          tag=latest
          case "$RELEASE_VERSION" in
            *-*) tag=next ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish core package through OIDC
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          wait_for_npm_value() {
            local package="$1"
            local field="$2"
            local expected="$3"
            local actual=""
            for attempt in {1..12}; do
              actual="$(npm view "$package" "$field" 2>/dev/null || true)"
              if [[ "$actual" == "$expected" ]]; then
                return 0
              fi
              sleep 5
            done
            echo "timed out waiting for npm $package $field=$expected (last=$actual)" >&2
            return 1
          }
          package=@hsblabs/scrape-kdl
          archive="dist/hsblabs-scrape-kdl-$RELEASE_VERSION.tgz"
          if npm view "$package@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "$package@$RELEASE_VERSION is already published"
          else
            npm publish "./$archive" --tag "$NPM_DIST_TAG"
          fi
          wait_for_npm_value "$package@$RELEASE_VERSION" version "$RELEASE_VERSION"
          wait_for_npm_value "$package" "dist-tags.$NPM_DIST_TAG" "$RELEASE_VERSION"
      - name: Publish Playwright adapter through OIDC
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          wait_for_npm_value() {
            local package="$1"
            local field="$2"
            local expected="$3"
            local actual=""
            for attempt in {1..12}; do
              actual="$(npm view "$package" "$field" 2>/dev/null || true)"
              if [[ "$actual" == "$expected" ]]; then
                return 0
              fi
              sleep 5
            done
            echo "timed out waiting for npm $package $field=$expected (last=$actual)" >&2
            return 1
          }
          package=@hsblabs/scrape-kdl-playwright
          archive="dist/hsblabs-scrape-kdl-playwright-$RELEASE_VERSION.tgz"
          if npm view "$package@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "$package@$RELEASE_VERSION is already published"
          else
            npm publish "./$archive" --tag "$NPM_DIST_TAG"
          fi
          wait_for_npm_value "$package@$RELEASE_VERSION" version "$RELEASE_VERSION"
          wait_for_npm_value "$package" "dist-tags.$NPM_DIST_TAG" "$RELEASE_VERSION"

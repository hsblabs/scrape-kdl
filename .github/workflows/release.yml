name: Release core

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: ./scripts/validate-release-tag.sh core "${GITHUB_REF_NAME}"
      - run: make release-check
      - run: make release-dist VERSION="${GITHUB_REF_NAME}" OUT=dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"

name: Scheduled fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "43 18 * * 2"

permissions:
  contents: read

concurrency:
  group: scheduled-fuzzing
  cancel-in-progress: false

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: go test ./internal/kdl -run=^$ -fuzz=FuzzParseNeverPanics -fuzztime=2m
      - run: go test ./internal/dom -run=^$ -fuzz=FuzzParseSelectorNeverPanics -fuzztime=2m
      - run: go test ./internal/dom -run=^$ -fuzz=FuzzParseHTMLNeverPanics -fuzztime=2m

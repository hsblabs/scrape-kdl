name: Publish private npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing core tag version without v, ending in -private.N
        required: true
        default: 0.9.0-private.1
        type: string
      confirmation:
        description: Type PUBLISH_PRIVATE_NPM
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-npm-release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmation == 'PUBLISH_PRIVATE_NPM'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Validate private publication request
        run: |
          if [[ "$REPOSITORY_VISIBILITY" != private ]]; then
            echo "refusing private npm publication while repository visibility is $REPOSITORY_VISIBILITY" >&2
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - name: Validate source tag
        run: |
          ./scripts/validate-private-release-tag.sh core "v$RELEASE_VERSION"
          test "$(git cat-file -t "refs/tags/v$RELEASE_VERSION")" = tag
          test "$(git describe --exact-match --tags HEAD)" = "v$RELEASE_VERSION"
      - run: npm run build:typescript
      - run: node scripts/build-npm-release.mjs --version "$RELEASE_VERSION" --access restricted --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-npm-${{ inputs.version }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-core:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: private-npm-${{ inputs.version }}
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          registry-url: https://registry.npmjs.org
      - name: Verify npm trusted publishing support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error(`npm ${process.argv[1]} does not support trusted publishing; require >=11.5.1`);
            }
          ' "$npm_version"
      - name: Publish restricted core package through OIDC
        run: npm publish "dist/hsblabs-scrape-kdl-$RELEASE_VERSION.tgz" --access restricted --tag private

  publish-adapter:
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: private-npm-${{ inputs.version }}
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          registry-url: https://registry.npmjs.org
      - name: Publish restricted Playwright adapter through OIDC
        run: npm publish "dist/hsblabs-scrape-kdl-playwright-$RELEASE_VERSION.tgz" --access restricted --tag private

name: Private release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Private release candidate tag-shaped version
        required: true
        default: v1.0.0-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: private-release-rehearsal
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/validate-release-tag.sh core "$RELEASE_VERSION"
      - run: make release-gate
      - run: make release-dist VERSION="$RELEASE_VERSION" OUT=dist NPM_ACCESS=restricted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-release-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

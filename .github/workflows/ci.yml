name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - ".codex/**"
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Go 1.26.x
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: make api-contract
      - run: make typescript-package
      - run: make conformance-coverage
      - run: make conformance
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/scrape-kdl
      - run: ./scripts/check-golden.sh
      - run: ./scripts/check-diagnostics.sh
      - run: ./scripts/check-module-paths.sh
      - run: ./scripts/check-format.sh

  race:
    name: Race / ubuntu-latest / Go 1.26.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: go test -race ./...

  rod-contract:
    name: go-rod adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: ./scripts/verify-rod-contract.sh

  rod-real:
    name: go-rod adapter / real dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: adapters/rod/go.mod
      - run: ./scripts/verify-rod.sh

  playwright-chromium:
    name: Playwright adapter / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "26.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make test-playwright-e2e

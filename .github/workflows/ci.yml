name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.23.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/scrape-kdl
      - run: ./scripts/check-golden.sh
      - run: ./scripts/check-diagnostics.sh
      - run: ./scripts/check-module-paths.sh
      - run: ./scripts/check-format.sh
      - if: matrix.go-version == '1.26.x' && matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  rod-contract:
    name: go-rod adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: ./scripts/verify-rod-contract.sh

  rod-real:
    name: go-rod adapter / real dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: adapters/rod/go.mod
      - working-directory: adapters/rod
        run: go test ./...
      - working-directory: adapters/rod
        run: go vet ./...
